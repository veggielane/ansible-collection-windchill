---
# GitLab CI for the acme.windchill collection.
#
#   lint      ansible-lint (production profile) + the manifest builds      every push / MR
#   test      loader self-test, build, install, syntax check of the roles   every push / MR
#   publish   push the built collection to Artifactory                      tags vX.Y.Z only
#
# CI/CD variables to define (Settings > CI/CD > Variables):
#   ARTIFACTORY_URL                 https://artifactory.example.com/artifactory   (no trailing slash)
#   ARTIFACTORY_ANSIBLE_REPO        virtual repo for installs, e.g. ansible          (optional: public Galaxy otherwise)
#   ARTIFACTORY_ANSIBLE_LOCAL_REPO  local repo to publish to, e.g. ansible-local
#   ARTIFACTORY_TOKEN               access token with deploy rights on the local repo (masked, protected)

stages:
  - lint
  - test
  - publish

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  ANSIBLE_FORCE_COLOR: "1"

default:
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - pip install --quiet "ansible-core>=2.17" ansible-lint
    # Route ansible-galaxy through Artifactory when it is configured, else use public Galaxy.
    - |
      if [ -n "$ARTIFACTORY_URL" ] && [ -n "$ARTIFACTORY_ANSIBLE_REPO" ]; then
        export ANSIBLE_GALAXY_SERVER_LIST=artifactory
        export ANSIBLE_GALAXY_SERVER_ARTIFACTORY_URL="$ARTIFACTORY_URL/api/ansible/$ARTIFACTORY_ANSIBLE_REPO/"
        export ANSIBLE_GALAXY_SERVER_ARTIFACTORY_TOKEN="$ARTIFACTORY_TOKEN"
      fi
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip

lint:
  stage: lint
  script:
    - ansible-lint --profile production
    # A broken galaxy.yml should fail here, not at publish time.
    - ansible-galaxy collection build --output-path /tmp/lint-build

selftest:
  stage: test
  script:
    # Exercise the loader's Jinja logic and the types file ordering on the
    # runner; neither needs a Windows host.
    - ansible-playbook tests/selftest.yml
    - ansible-playbook tests/types_order.yml
    - ansible-playbook tests/icons_target.yml

build:
  stage: test
  script:
    - ansible-galaxy collection build --output-path dist
    # Install the artifact into an empty path so its dependencies
    # (ansible.windows, ...) are pulled too, then check the roles parse there.
    - export ANSIBLE_COLLECTIONS_PATH=/tmp/collections
    - ansible-galaxy collection install dist/*.tar.gz
    - ansible-galaxy collection list
    - ansible-playbook --syntax-check tests/syntax.yml
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - VERSION=$(python -c "import yaml; print(yaml.safe_load(open('galaxy.yml'))['version'])")
    - |
      if [ "v$VERSION" != "$CI_COMMIT_TAG" ]; then
        echo "galaxy.yml says version $VERSION but the tag is $CI_COMMIT_TAG - bump galaxy.yml and re-tag"
        exit 1
      fi
      if [ -z "$ARTIFACTORY_URL" ] || [ -z "$ARTIFACTORY_ANSIBLE_LOCAL_REPO" ] || [ -z "$ARTIFACTORY_TOKEN" ]; then
        echo "ARTIFACTORY_URL, ARTIFACTORY_ANSIBLE_LOCAL_REPO and ARTIFACTORY_TOKEN must be set"
        exit 1
      fi
    - ansible-galaxy collection build --output-path dist
    - ansible-galaxy collection publish "dist/acme-windchill-$VERSION.tar.gz"
        --server "$ARTIFACTORY_URL/api/ansible/$ARTIFACTORY_ANSIBLE_LOCAL_REPO/"
        --token "$ARTIFACTORY_TOKEN"
    - echo "Published acme.windchill $VERSION. Raise the pin in the config repo's requirements-windchill.yml."
