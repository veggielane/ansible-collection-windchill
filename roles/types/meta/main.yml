---
galaxy_info:
  author: windchill-ansible
  description: Import Windchill soft types, attributes, layouts and enumerations with LoadFromFile
  license: MIT
  min_ansible_version: "2.17"
  platforms:
    - name: Windows
      versions:
        - all

# Roles listed here run BEFORE this role's tasks, in this order.
# icons comes first because a type definition refers to its icon file under
# codebase\netmarkets\images, which must already be there.
dependencies:
  - role: acme.windchill.common
  - role: acme.windchill.icons
