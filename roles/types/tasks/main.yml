---
# Entry point of the role. Ansible runs this once per host, after
# acme.windchill.common (meta/main.yml). Roles that need the types to exist
# first (oir) list this role as a dependency, so Ansible orders them.

- name: Check that windchill_types_files is a list of well-formed entries
  ansible.builtin.assert:
    that:
      - windchill_types_files | type_debug == 'list'
      - windchill_types_files | rejectattr('name', 'defined') | list | length == 0
      - windchill_types_files | rejectattr('load_file', 'defined') | list | length == 0
    fail_msg: >-
      Every entry in windchill_types_files needs a 'name' and a 'load_file'
      (path relative to config_dir). See roles/types/README.md.
    quiet: true

- name: Say so when there is nothing to import
  ansible.builtin.debug:
    msg: "windchill_types_files is empty - list exported type load files in inventory/group_vars/windchill/types.yml"
  when: windchill_types_files | length == 0

- name: Import each type load file, in order
  ansible.builtin.include_tasks: load_item.yml
  loop: "{{ windchill_types_files }}"
  loop_control:
    loop_var: windchill_types_item
    label: "{{ windchill_types_item.name }}"
