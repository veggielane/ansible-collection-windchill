---
# Stages ONE exported type load file and hands it to the shared loader.
# main.yml includes this once per entry of windchill_types_files; the entry
# is in windchill_types_item.
#
#   copy             ->  <staging_dir>\staging\types_<name>.xml   (this file)
#   load if changed  ->  roles/common/tasks/load_file.yml         (shared)

- name: Work out safe names for type file {{ windchill_types_item.name }}
  ansible.builtin.set_fact:
    windchill_types_safe_name: "{{ windchill_types_item.name | regex_replace('[^A-Za-z0-9_.-]', '_') }}"

- name: Work out the staging path for type file {{ windchill_types_item.name }}
  ansible.builtin.set_fact:
    windchill_types_staging_file: "{{ windchill_staging_dir }}\\staging\\types_{{ windchill_types_safe_name }}.xml"

# The export is already a complete LoadFromFile document, so there is
# nothing to render: copy it as-is.
- name: Copy the exported load file for type file {{ windchill_types_item.name }}
  ansible.windows.win_copy:
    src: "{{ config_dir }}/{{ windchill_types_item.load_file }}"
    dest: "{{ windchill_types_staging_file }}"

- name: Load the staged file for type file {{ windchill_types_item.name }}
  ansible.builtin.include_role:
    name: acme.windchill.common
    tasks_from: load_file
  vars:
    windchill_load_file: "{{ windchill_types_staging_file }}"
    windchill_load_label: "types_{{ windchill_types_safe_name }}"
    windchill_load_container_path: "{{ windchill_types_item.container_path | default('') }}"
    windchill_load_force: "{{ windchill_types_force }}"
