---
# Prepares ONE rule and hands it to the shared loader. main.yml includes this
# file once per entry of windchill_oir_rules; the entry is in windchill_oir_rule.
#
#   render or copy   ->  <staging_dir>\staging\oir_<name>.xml        (this file)
#   load if changed  ->  roles/common/tasks/load_file.yml  (shared)

- name: Work out safe names for rule {{ windchill_oir_rule.name }}
  ansible.builtin.set_fact:
    # Rule names may contain characters that are illegal in file names ("|", ":").
    windchill_oir_safe_name: "{{ windchill_oir_rule.name | regex_replace('[^A-Za-z0-9_.-]', '_') }}"
    windchill_oir_container_path: "{{ windchill_oir_rule.container_path | default(windchill_default_container_path) }}"

- name: Work out the staging path for rule {{ windchill_oir_rule.name }}
  ansible.builtin.set_fact:
    windchill_oir_staging_file: "{{ windchill_staging_dir }}\\staging\\oir_{{ windchill_oir_safe_name }}.xml"

# Two ways to get a load file: render our template around the rule body, or
# copy a complete load file the user already has. `when` picks one.
- name: Render the load file from the template for rule {{ windchill_oir_rule.name }}
  ansible.windows.win_template:
    src: oir_load.xml.j2                   # roles/oir/templates/
    dest: "{{ windchill_oir_staging_file }}"
  when: windchill_oir_rule.load_file is not defined

- name: Copy the ready-made load file for rule {{ windchill_oir_rule.name }}
  ansible.windows.win_copy:
    src: "{{ config_dir }}/{{ windchill_oir_rule.load_file }}"
    dest: "{{ windchill_oir_staging_file }}"
  when: windchill_oir_rule.load_file is defined

- name: Load the staged file for rule {{ windchill_oir_rule.name }}
  ansible.builtin.include_role:
    name: acme.windchill.common
    tasks_from: load_file
  vars:
    windchill_load_file: "{{ windchill_oir_staging_file }}"
    windchill_load_label: "oir_{{ windchill_oir_safe_name }}"
    windchill_load_container_path: "{{ windchill_oir_container_path }}"
    windchill_load_force: "{{ windchill_oir_force }}"
