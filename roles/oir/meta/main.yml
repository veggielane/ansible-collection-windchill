---
galaxy_info:
  author: windchill-ansible
  description: Load Windchill object initialization rules with LoadFromFile
  license: MIT
  min_ansible_version: "2.17"
  platforms:
    - name: Windows
      versions:
        - all

# Roles listed here run BEFORE this role's tasks, in this order.
# types comes first because a rule for a soft type cannot be loaded until
# the type exists.
dependencies:
  - role: acme.windchill.common
  - role: acme.windchill.types
